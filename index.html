<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>いーくら スキャン</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26; --border: #2a2a3a;
    --accent: #00e5a0; --accent2: #7c3aed; --warn: #f59e0b; --danger: #ef4444;
    --text: #f0f0f8; --text2: #8888aa; --card-bg: #16162a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; overflow-x: hidden; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; gap: 10px; }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: var(--accent); }
  .logo span { color: var(--text2); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .badge { background: var(--accent2); color: white; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .btn-modeback { background: transparent; border: 1px solid var(--border); color: var(--text2); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; white-space: nowrap; }
  #setup-panel { padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
  .field-label { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  input[type="text"], input[type="password"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; padding: 12px 14px; outline: none; font-family: 'Noto Sans JP', sans-serif; }
  input:focus { border-color: var(--accent); }
  select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; padding: 12px 14px; outline: none; font-family: 'Noto Sans JP', sans-serif; }
  select:focus { border-color: var(--accent); }
  .reg-form { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
  .reg-form .field-label { margin-bottom: 4px; }
  .reg-form input[type="text"] { background: var(--surface); }
  .reg-mpn { font-family: monospace; font-size: 13px; color: var(--accent); background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 8px 10px; }
  .reg-check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); }
  .reg-check input { width: auto; }
  .btn-reg { background: var(--warn); color: #000; font-weight: 700; border: none; border-radius: 10px; padding: 12px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; }
  .btn-primary { width: 100%; background: var(--accent); color: #000; font-weight: 700; font-size: 15px; border: none; border-radius: 12px; padding: 14px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
  .btn-primary:active { opacity: 0.85; }
  #mode-panel { display: none; padding: 8px 20px 40px; }
  .mode-card { width: 100%; text-align: left; background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 18px 16px; margin-bottom: 12px; cursor: pointer; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 17px; font-weight: 700; display: flex; flex-direction: column; gap: 4px; }
  .mode-card:active { border-color: var(--accent); }
  .mode-card small { font-size: 12px; font-weight: 400; color: var(--text2); }
  #scan-panel { display: none; padding: 0 0 100px; }
  .counter-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .counter-info { font-size: 13px; color: var(--text2); }
  .counter-info strong { color: var(--accent); font-size: 18px; }
  .btn-finish { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 13px; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
  .btn-finish:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--text2); color: var(--text2); }
  .camera-section { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .camera-box { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 16px; overflow: hidden; border: 1.5px solid var(--border); }
  .camera-box.portrait { aspect-ratio: 3/4; max-height: 60vh; margin: 0 auto; }
  #video { width: 100%; height: 100%; object-fit: cover; }
  .camera-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .scan-frame { width: 70%; aspect-ratio: 1.6; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45); }
  .scan-frame.portrait { width: auto; height: 80%; aspect-ratio: 63/88; } /* トレカ実寸 63x88mm 縦 */
  #canvas { display: none; }
  .btn-shoot { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); color: var(--text); font-weight: 700; font-size: 16px; padding: 16px; border-radius: 14px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .manual-input-row { display: flex; gap: 8px; }
  .manual-input-row input { flex: 1; }
  .btn-manual { background: var(--accent2); color: white; font-weight: 700; font-size: 14px; border: none; border-radius: 10px; padding: 0 18px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; white-space: nowrap; }
  #result-panel { padding: 0 20px 20px; display: none; }
  .section-title { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; padding-top: 20px; }
  .ocr-result { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--text2); margin-bottom: 4px; line-height: 1.6; }
  .ocr-result .extracted { font-size: 16px; font-weight: 700; color: var(--accent); font-family: 'Syne', monospace; letter-spacing: 1px; }
  .suggest-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .suggest-card.selected { border-color: var(--accent); }
  .suggest-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .suggest-img-placeholder { width: 56px; height: 56px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .suggest-img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .suggest-meta { flex: 1; min-width: 0; }
  .suggest-title { font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; word-break: break-all; }
  .suggest-code { font-size: 11px; color: var(--text2); font-family: monospace; }
  .suggest-category { display: inline-block; font-size: 10px; color: var(--accent2); border: 1px solid var(--accent2); padding: 1px 7px; border-radius: 10px; margin-top: 4px; }
  .price-row { display: flex; gap: 8px; margin-top: 8px; }
  .price-chip { flex: 1; border-radius: 8px; padding: 8px 10px; text-align: center; }
  .price-chip.buy { background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.3); }
  .price-chip.sell { background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); }
  .price-chip .label { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 2px; }
  .price-chip.buy .label { color: var(--accent); }
  .price-chip.sell .label { color: #a855f7; }
  .price-chip .value { font-size: 15px; font-weight: 800; font-family: 'Syne', monospace; }
  .price-chip .value.na { font-size: 11px; font-weight: 400; color: var(--text2); }
  .suggest-actions { display: flex; gap: 10px; }
  .btn-yes { flex: 1; background: var(--accent); color: #000; font-weight: 700; font-size: 14px; border: none; border-radius: 10px; padding: 11px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
  .btn-no { flex: 1; background: transparent; color: var(--text2); font-weight: 700; font-size: 14px; border: 1.5px solid var(--border); border-radius: 10px; padding: 11px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
  #selected-list { padding: 0 20px 20px; display: none; }
  .selected-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface2); border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
  .selected-item .check { color: var(--accent); font-size: 16px; }
  .selected-item .name { flex: 1; }
  .selected-item .price { font-size: 11px; color: var(--accent); font-family: 'Syne', monospace; }
  .selected-item .remove { color: var(--danger); background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px; }
  #confirm-panel { display: none; padding: 20px; }
  .confirm-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .confirm-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .confirm-item:last-child { border-bottom: none; }
  .confirm-num { width: 22px; height: 22px; background: var(--accent2); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .btn-submit { width: 100%; background: linear-gradient(135deg, var(--accent2), #a855f7); color: white; font-weight: 700; font-size: 16px; border: none; border-radius: 14px; padding: 18px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; box-shadow: 0 4px 20px rgba(124,58,237,0.35); }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-back { width: 100%; background: transparent; color: var(--text2); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; margin-top: 10px; }
  #done-panel { display: none; padding: 60px 20px; text-align: center; }
  .done-icon { font-size: 64px; margin-bottom: 20px; }
  .done-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
  .done-sub { color: var(--text2); font-size: 14px; line-height: 1.7; }
  .done-code { font-family: monospace; font-size: 18px; color: var(--accent); background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; margin: 20px 0; letter-spacing: 2px; }
  .btn-restart { margin-top: 20px; width: 100%; background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 700; }
  .loading-overlay { position: fixed; inset: 0; background: rgba(10,10,15,0.85); display: none; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 16px; }
  .loading-overlay.show { display: flex; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text2); font-size: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 20px; font-size: 13px; color: var(--text); z-index: 999; transition: transform 0.3s ease; white-space: nowrap; max-width: 90vw; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--accent); color: var(--accent); }
  .no-result { text-align: center; padding: 24px 20px 10px; color: var(--text2); font-size: 14px; }
  .no-result .emoji { font-size: 36px; margin-bottom: 10px; }
  .no-result-actions { display: flex; gap: 10px; padding: 10px 0 4px; }
  .notice { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--warn); }
  .btn-reg-toggle { width: 100%; background: transparent; border: 1.5px dashed var(--warn); color: var(--warn); font-weight: 700; font-size: 13px; padding: 11px; border-radius: 10px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; margin-top: 8px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,10,15,0.9); display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
  .modal-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: var(--accent); }
  .modal-sub { font-size: 12px; color: var(--text2); line-height: 1.6; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions .btn-primary, .modal-actions .btn-back { margin-top: 0; }
  .cat-ok { background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.3); color: var(--accent); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
  .cat-ok small { color: var(--warn); }
  .cat-ng { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <button class="btn-modeback" id="btn-modeback" style="display:none">← モード選択</button>
  <div class="logo">いーくら <span>スキャン</span></div>
  <div class="badge" id="mode-badge">設定</div>
</header>

<!-- STEP1: APIキー -->
<div id="setup-panel">
  <div class="notice">⚠️ テスト用プロトタイプ</div>
  <div>
    <div class="field-label">RECORE APIキー</div>
    <input type="password" id="api-key" placeholder="rc_..." autocomplete="off">
  </div>
  <div>
    <div class="field-label">店舗ID</div>
    <input type="text" id="store-id" placeholder="1" value="1">
  </div>
  <button class="btn-primary" id="btn-start">モード選択へ →</button>
</div>

<!-- STEP2: モード選択 -->
<div id="mode-panel">
  <div class="section-title" style="padding-top:24px">モードを選択</div>
  <button class="mode-card" data-mode="bas">🛒 買取モード
    <small>型番を読み取り、買取ケースを作成</small></button>
  <button class="mode-card" data-mode="big">🚚 店間移動モード
    <small>型番を読み取り、一般仕入れケースを作成（疑似店間移動）</small></button>
  <button class="mode-card" data-mode="catalog">🗂 カタログ登録モード
    <small>背景除去＋カテゴリ指定で商品マスタに登録</small></button>
</div>

<!-- STEP3: スキャン -->
<div id="scan-panel">
  <div class="counter-bar">
    <div class="counter-info"><span id="counter-label">選択済み</span> <strong id="selected-count">0</strong> 件</div>
    <button class="btn-finish" id="btn-finish" disabled>完了 →</button>
  </div>
  <div class="camera-section">
    <div class="camera-box" id="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="camera-overlay"><div class="scan-frame" id="scan-frame"></div></div>
    </div>
    <canvas id="canvas"></canvas>
    <button class="btn-shoot" id="btn-shoot"><span>📸</span> カードを撮影する</button>
    <div class="manual-input-row" id="manual-row">
      <input type="text" id="manual-mpn" placeholder="読めない時は型番を手入力 (例: 210/184)" autocomplete="off">
      <button class="btn-manual" id="btn-manual">検索</button>
    </div>
  </div>
  <div id="result-panel">
    <div class="section-title">OCR 読み取り結果</div>
    <div class="ocr-result" id="ocr-display"></div>
    <div class="section-title" id="suggest-title">カタログ候補</div>
    <div id="suggest-container"></div>
  </div>
  <div id="selected-list">
    <div class="section-title" id="selected-title">選択済み ✓</div>
    <div id="selected-items-container"></div>
  </div>
</div>

<!-- 確認（買取/店間移動のみ） -->
<div id="confirm-panel">
  <div class="section-title" id="confirm-title">ケース作成確認</div>
  <div class="confirm-card" id="confirm-list"></div>
  <button class="btn-submit" id="btn-submit">🛒 RECORE にケースを作成する</button>
  <button class="btn-back" id="btn-back">← スキャンに戻る</button>
</div>

<!-- 完了 -->
<div id="done-panel">
  <div class="done-icon">✅</div>
  <div class="done-title" id="done-title">完了</div>
  <div class="done-sub" id="done-sub"></div>
  <div class="done-code" id="done-code">BS-XXXXXXXX</div>
  <div class="done-sub" id="done-detail"></div>
  <button class="btn-restart" id="btn-restart">🔄 続けてスキャン</button>
</div>

<!-- カテゴリID照合モーダル（カタログ登録モード専用） -->
<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <div class="modal-title">🗂 カタログ登録モード</div>
    <div class="modal-sub">登録先のトレカ カテゴリID（1エキスパンション分）を指定してください。RECOREのカテゴリマスタと照合します。存在しないIDでは開始できません。</div>
    <div>
      <div class="field-label">カテゴリID</div>
      <input type="text" id="cat-id-input" inputmode="numeric" placeholder="例: 123" autocomplete="off">
    </div>
    <button class="btn-primary" id="cat-verify">照合する</button>
    <div id="cat-result"></div>
    <div class="modal-actions">
      <button class="btn-back" id="cat-cancel">← モード選択</button>
      <button class="btn-primary" id="cat-start" style="display:none">このカテゴリで開始 →</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">処理中...</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  var BASE_URL = 'https://co-api.recore-pos.com';
  var OCR_PROXY = 'https://ikura-ocr-proxy.lunaless.workers.dev';
  var storeId = 1;
  var mode = 'bas';              // 'bas'=買取 / 'big'=店間移動 / 'catalog'=カタログ登録
  var defaultCategoryId = null;  // カタログ登録: 直近入力を記憶してプリフィル
  var stream = null;
  var selectedProducts = [];     // bas/big=ケース対象 / catalog=登録済み一覧
  var toastTimer = null;
  var lastShotBase64 = null;     // 直近の撮影画像(生base64/jpeg)。手入力時はnull
  var lastPrimaryCode = '';      // 直近の検索コード(mpn候補)
  var lastExtract = { title: '' };// カタログ登録: フルOCRの抽出結果
  var verifiedCategoryId = null; // 照合済みの候補ID(開始押下でdefaultCategoryIdに確定)

  function el(id) { return document.getElementById(id); }
  function getApiKey() { return el('api-key').value.trim(); }
  function isCase() { return mode === 'bas' || mode === 'big'; }
  function modeLabel(m) { return m === 'bas' ? '買取' : m === 'big' ? '店間移動' : 'カタログ登録'; }

  function showLoading(text) { el('loading-text').textContent = text; el('loading').classList.add('show'); }
  function hideLoading() { el('loading').classList.remove('show'); }
  function showToast(msg, type) {
    var t = el('toast');
    t.textContent = msg;
    t.className = 'toast' + (type ? ' ' + type : '') + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3000);
  }
  function yen(v) { return '¥' + Number(v).toLocaleString('ja-JP'); }

  // ===== STEP1 → STEP2 =====
  function goModeSelect() {
    if (!getApiKey()) { showToast('APIキーを入力してください', 'error'); return; }
    storeId = parseInt(el('store-id').value.trim()) || 1;
    el('setup-panel').style.display = 'none';
    el('mode-panel').style.display = 'block';
    el('mode-badge').textContent = 'モード選択';
    el('btn-modeback').style.display = 'none';
  }

  // ===== STEP2 → STEP3 =====
  function selectMode(m) {
    if (m === 'catalog') { openCatModal(); return; } // 先にカテゴリ照合
    enterScan(m);
  }

  // カタログ登録: カテゴリID照合モーダル
  function openCatModal() {
    el('mode-panel').style.display = 'none';
    el('cat-modal').classList.add('show');
    el('cat-id-input').value = (defaultCategoryId != null ? defaultCategoryId : '');
    el('cat-result').innerHTML = '';
    el('cat-start').style.display = 'none';
    verifiedCategoryId = null;
  }
  function closeCatModal() { el('cat-modal').classList.remove('show'); }

  async function verifyCategory() {
    var id = parseInt(el('cat-id-input').value.trim());
    if (isNaN(id)) { showToast('カテゴリIDを入力してください', 'error'); return; }
    el('cat-result').innerHTML = '<div class="reg-check">照合中...</div>';
    el('cat-start').style.display = 'none';
    verifiedCategoryId = null;
    try {
      var res = await fetch(BASE_URL + '/products/categories?ids=' + id + '&limit=1', {
        headers: { 'Authorization': getApiKey() }
      });
      if (!res.ok) { throw new Error('status ' + res.status); }
      var arr = await res.json();
      var cat = Array.isArray(arr) ? arr.filter(function(c) { return c.id === id; })[0] : null;
      if (!cat) {
        el('cat-result').innerHTML = '<div class="cat-ng">✗ ID ' + id + ' はRECOREに存在しません。<br>RECORE側でカテゴリを作成してからやり直してください。</div>';
        return;
      }
      var path = (cat.ancestors || []).map(function(a) { return a.name; }).concat([cat.name]).join(' › ');
      el('cat-result').innerHTML = '<div class="cat-ok">✓ ' + path +
        (cat.is_leaf === false ? '<br><small>※末端カテゴリではありません（子カテゴリあり）</small>' : '') + '</div>';
      verifiedCategoryId = id;
      el('cat-start').style.display = '';
    } catch (e) {
      el('cat-result').innerHTML = '<div class="cat-ng">照合エラー: ' + e.message + '</div>';
    }
  }

  // ガイド枠(+マージン)にクロップして撮影 → 型番に画素を集中させOCR精度UP
  // object-fit:cover の表示座標を動画の実ピクセルへ逆変換してクロップ
  function captureCardCanvas(pad) {
    var video = el('video');
    var vW = video.videoWidth, vH = video.videoHeight;
    var canvas = el('canvas');
    if (!vW || !vH) return null;
    var box = el('camera-box').getBoundingClientRect();
    var frame = el('scan-frame').getBoundingClientRect();
    var scale = Math.max(box.width / vW, box.height / vH); // cover
    var visW = box.width / scale, visH = box.height / scale; // 動画上で見えている範囲
    var offX = (vW - visW) / 2, offY = (vH - visH) / 2;
    var fx = Math.min(1, (frame.width / box.width) * (1 + pad));
    var fy = Math.min(1, (frame.height / box.height) * (1 + pad));
    var cropW = fx * visW, cropH = fy * visH;
    var cropX = offX + (visW - cropW) / 2;
    var cropY = offY + (visH - cropH) / 2;
    canvas.width = Math.round(cropW);
    canvas.height = Math.round(cropH);
    canvas.getContext('2d').drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  // ===== 撮影 / 手入力 =====
  function shoot() {
    var video = el('video');
    // カタログ=カードを切り落とさない程度に少し広め(最終のピッタリ切りはremove.bgのcropが担当)
    // 買取・店間移動=型番位置が様々→切れ防止で広め
    var canvas = captureCardCanvas(mode === 'catalog' ? 0.12 : 0.5);
    if (!canvas) { // 動画未準備時はフルフレームでフォールバック
      canvas = el('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
    }
    // PNG無圧縮で送信（圧縮ノイズ無し）。ただしClaudeの画像上限(約5MB)を超える時は高品質JPEGへ
    var dataUrl = canvas.toDataURL('image/png');
    if (dataUrl.length > 6500000) { dataUrl = canvas.toDataURL('image/jpeg', 0.95); }
    lastShotBase64 = dataUrl; // data URL のまま保持（Worker側でmedia_type判定）
    var reqBody = { base64Image: dataUrl };
    if (mode === 'catalog') reqBody.mode = 'full'; // タイトルも抽出
    showLoading('OCR解析中...');
    fetch(OCR_PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(reqBody)
    }).then(function(res) { return res.json(); }).then(function(data) {
      var codes = data.codes || [];
      lastExtract = { title: (data.title || '') };
      if (!codes.length) {
        if (mode === 'catalog') {
          // 登録モードは読めなくても登録に進む（型番はフォームで手入力）
          lastPrimaryCode = '';
          el('ocr-display').innerHTML = '型番を自動読取できませんでした（フォームで手入力可）';
          el('result-panel').style.display = 'block';
          var c = el('suggest-container'); c.innerHTML = '';
          renderCatalogRegister(c);
          hideLoading();
          return;
        }
        showToast('型番を認識できませんでした。手入力で検索できます。', 'error');
        hideLoading();
        return;
      }
      el('ocr-display').innerHTML = '認識されたコード: <br>' + codes.map(function(c) {
        return '<span class="extracted">' + c + '</span>';
      }).join(' / ');
      el('result-panel').style.display = 'block';
      showLoading('カタログ照合中...');
      return searchCatalog(codes);
    }).catch(function(e) {
      showToast('エラー: ' + e.message, 'error');
    }).then(function() { hideLoading(); });
  }

  function manualSearch() {
    var v = el('manual-mpn').value.trim();
    if (!v) { showToast('型番を入力してください', 'error'); return; }
    lastShotBase64 = null; // 手入力は添付写真なし
    lastExtract = { title: '' };
    el('ocr-display').innerHTML = '手入力: <span class="extracted">' + v + '</span>';
    el('result-panel').style.display = 'block';
    showLoading('カタログ照合中...');
    searchCatalog([v]).then(function() {
      hideLoading();
      el('manual-mpn').value = '';
    }).catch(function(e) {
      hideLoading();
      showToast('エラー: ' + e.message, 'error');
    });
  }

  // ===== カタログ照合 =====
  function searchCatalog(codes) {
    lastPrimaryCode = (codes && codes[0]) ? codes[0] : '';
    var container = el('suggest-container');
    container.innerHTML = '';
    var allProducts = [];
    var seen = {};
    var promises = codes.map(function(c) {
      return fetch(BASE_URL + '/products?pa_mpn=' + encodeURIComponent(c) + '&limit=10', {
        headers: { 'Authorization': getApiKey() }
      }).then(function(res) { return res.ok ? res.json() : []; })
        .then(function(r) { if (Array.isArray(r)) allProducts = allProducts.concat(r); })
        .catch(function() {});
    });
    return Promise.all(promises).then(function() {
      var unique = allProducts.filter(function(p) {
        if (seen[p.id]) return false; seen[p.id] = true; return true;
      });

      if (mode === 'catalog') {
        if (unique.length) { renderExists(container, unique); }
        else { renderCatalogRegister(container); }
        return;
      }
      // bas / big
      if (!unique.length) { renderNoResult(container); return; }
      return fetchPriceRules(unique).then(function(priceMap) {
        unique.forEach(function(p) { renderCard(p, priceMap[p.id]); });
      });
    });
  }

  function fetchPriceRules(products) {
    var ids = products.map(function(p) { return p.id; }).join(',');
    return fetch(BASE_URL + '/setting/price_product_company_rules?product_ids=' + ids + '&limit=250', {
      headers: { 'Authorization': getApiKey() }
    }).then(function(res) { return res.ok ? res.json() : []; }).then(function(rules) {
      var map = {};
      if (Array.isArray(rules)) {
        rules.forEach(function(rule) {
          var buy = null, sell = null;
          if (Array.isArray(rule.settings)) {
            rule.settings.forEach(function(s) {
              if (s.buy_price && s.buy_price.value != null && buy == null) buy = s.buy_price.value;
              if (s.sell_price && s.sell_price.value != null && sell == null) sell = s.sell_price.value;
            });
          }
          map[rule.product_id] = { buy: buy, sell: sell };
        });
      }
      return map;
    }).catch(function() { return {}; });
  }

  // 選択リストへ追加（product_id重複を弾く）
  function addToSelection(id, title, code, buy, sell) {
    if (selectedProducts.filter(function(x) { return x.product_id === id; }).length) {
      showToast('すでにリストにあります', 'error');
      return false;
    }
    selectedProducts.push({ product_id: id, title: title, code: code, buy: buy, sell: sell });
    updateList();
    return true;
  }

  function resetResultView() {
    el('result-panel').style.display = 'none';
    el('ocr-display').innerHTML = '';
    el('suggest-container').innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ===== 買取/店間移動: カタログ候補カード =====
  function renderCard(p, price) {
    var container = el('suggest-container');
    var card = document.createElement('div');
    card.className = 'suggest-card';

    var header = document.createElement('div');
    header.className = 'suggest-header';

    var thumb = document.createElement('div');
    if (p.image_urls && p.image_urls[0]) {
      thumb = document.createElement('img');
      thumb.className = 'suggest-img';
      thumb.src = p.image_urls[0];
    } else {
      thumb.className = 'suggest-img-placeholder';
      thumb.textContent = '🃏';
    }

    var meta = document.createElement('div');
    meta.className = 'suggest-meta';
    var mpn = (p.attribute && p.attribute.mpn) ? p.attribute.mpn : '';
    var rarity = (p.attribute && p.attribute.custom_rarity) ? p.attribute.custom_rarity : '';
    var expansion = (p.attribute && p.attribute.custom_expansion_name) ? p.attribute.custom_expansion_name : '';
    meta.innerHTML =
      '<div class="suggest-title">' + (p.title || '（タイトルなし）') + '</div>' +
      '<div class="suggest-code">' + p.code + '</div>' +
      (mpn ? '<div class="suggest-code">型番: ' + mpn + (rarity ? ' / ' + rarity : '') + '</div>' : '') +
      (expansion ? '<div class="suggest-category">' + expansion + '</div>' : '');

    header.appendChild(thumb);
    header.appendChild(meta);

    var priceRow = document.createElement('div');
    priceRow.className = 'price-row';
    var buyVal = (price && price.buy != null) ? yen(price.buy) : '未設定';
    var sellVal = (price && price.sell != null) ? yen(price.sell) : '未設定';
    var buyNa = (price && price.buy != null) ? '' : ' na';
    var sellNa = (price && price.sell != null) ? '' : ' na';
    priceRow.innerHTML =
      '<div class="price-chip buy"><div class="label">買取推奨</div><div class="value' + buyNa + '">' + buyVal + '</div></div>' +
      '<div class="price-chip sell"><div class="label">販売推奨</div><div class="value' + sellNa + '">' + sellVal + '</div></div>';

    var actions = document.createElement('div');
    actions.className = 'suggest-actions';

    var btnYes = document.createElement('button');
    btnYes.className = 'btn-yes';
    btnYes.textContent = '✓ これです';
    btnYes.onclick = function() {
      if (addToSelection(p.id, p.title, p.code, price ? price.buy : null, price ? price.sell : null)) {
        card.classList.add('selected');
        actions.innerHTML = '<span style="color:var(--accent);font-weight:700">✓ 追加済み — 次のカードを撮影してください</span>';
        showToast('追加しました ✓ 次のカードへ', 'success');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    var btnNo = document.createElement('button');
    btnNo.className = 'btn-no';
    btnNo.textContent = '✗ 違う';
    btnNo.onclick = function() {
      card.style.opacity = '0.35';
      btnNo.disabled = true; btnYes.disabled = true;
      showToast('スキップしました', '');
    };

    actions.appendChild(btnYes);
    actions.appendChild(btnNo);
    card.appendChild(header);
    card.appendChild(priceRow);
    card.appendChild(actions);
    container.appendChild(card);
  }

  // ===== 買取/店間移動: 一致なし → スルー =====
  function renderNoResult(container) {
    var wrap = document.createElement('div');

  // ===== カタログ登録: 既にマスタあり =====
  function renderExists(container, products) {

      '<div class="suggest-code">' + p.code + (mpn ? ' / 型番: ' + mpn : '') + '</div>';

    actions.className = 'no-result-actions';
    var btnNext = document.createElement('button');
    btnNext.className = 'btn-yes';
    btnNext.textContent = '📸 次のカードへ';
    btnNext.onclick = function() { resetResultView(); showToast('次のカードを撮影してください', ''); };
    actions.appendChild(btnNext);
    wrap.appendChild(actions);

  // ===== カタログ登録: 新規登録フォーム =====
  function renderCatalogRegister(container) {
    var wrap = document.createElement('div');
    wrap.className = 'no-result';
    wrap.innerHTML = '<div class="emoji">🗂</div>マスタ未登録 — 新規登録します';

    var photoNote = (lastShotBase64)
      ? '<label class="reg-check"><input type="checkbox" id="reg-photo" checked> 撮影写真を背景除去して添付</label>'
      : '<div class="reg-check">（手入力のため添付写真なし）</div>';

    var form = document.createElement('div');
    form.className = 'reg-form';
    form.innerHTML =
      '<div class="reg-check">登録先カテゴリID: <span style="color:var(--accent);font-weight:700">' + (defaultCategoryId != null ? defaultCategoryId : '未設定') + '</span>（このモードは固定）</div>' +
      '<div><div class="field-label">型番 (mpn) ／ 次回から検索ヒット（手入力可）</div>' +
        '<input type="text" id="reg-mpn" placeholder="例: 210/184" value="' + (lastPrimaryCode || '') + '"></div>' +
      '<div><div class="field-label">商品名 <span style="color:var(--danger)">*必須</span></div>' +
        '<input type="text" id="reg-title" placeholder="例: リザードンex SAR" value="' + (lastExtract.title || '').replace(/"/g, '&quot;') + '"></div>' +
      '<div><div class="field-label">レアリティ（任意）</div>' +
        '<input type="text" id="reg-rarity" placeholder="例: SAR"></div>' +
      '<div><div class="field-label">弾名（任意）</div>' +
        '<input type="text" id="reg-expansion" placeholder="例: 黒炎の支配者"></div>' +
      photoNote +
      '<button class="btn-reg" id="reg-submit">マスタ登録する</button>';

    var actions = document.createElement('div');
    actions.className = 'no-result-actions';
    var btnSkip = document.createElement('button');
    btnSkip.className = 'btn-no';
    btnSkip.textContent = '⏭ 登録せず次へ';
    btnSkip.onclick = function() { resetResultView(); showToast('次のカードを撮影してください', ''); };
    actions.appendChild(btnSkip);

    wrap.appendChild(form);
    wrap.appendChild(actions);
    container.appendChild(wrap);

    form.querySelector('#reg-submit').onclick = function() {
      var btn = this;
      var title = form.querySelector('#reg-title').value.trim();
      if (!title) { showToast('商品名を入力してください', 'error'); return; }
      if (defaultCategoryId == null) { showToast('カテゴリ未設定です。モードを選び直してください', 'error'); return; }
      var cat = defaultCategoryId; // セッション固定カテゴリ
      var mpn = form.querySelector('#reg-mpn').value.trim();
      var usePhoto = !!(form.querySelector('#reg-photo') && form.querySelector('#reg-photo').checked);
      registerCatalog({
        title: title,
        mpn: mpn,
        categoryId: cat,
        rarity: form.querySelector('#reg-rarity').value.trim(),
        expansion: form.querySelector('#reg-expansion').value.trim(),
        usePhoto: usePhoto
      }, btn);
    };
  }

  // pa_mpn で既存検索（重複ガード / 登録後確認に共用）
  async function findByMpn(code) {
    if (!code) return [];
    var res = await fetch(BASE_URL + '/products?pa_mpn=' + encodeURIComponent(code) + '&limit=10', {
      headers: { 'Authorization': getApiKey() }
    });
    if (!res.ok) return [];
    var r = await res.json();
    return Array.isArray(r) ? r : [];
  }

  // ===== 画像: 背景除去 → RECORE アップロード → 公開URL =====
  function b64ToBlob(b64, mime) {
    var bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
    for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  async function removeBg(base64) {
    var res = await fetch(OCR_PROXY + '/removebg', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base64Image: base64 })
    });
    if (!res.ok) { throw new Error('背景除去 ' + res.status + ': ' + (await res.text())); }
    return (await res.json()).base64Image;
  }

  async function uploadImageToRecore(pngBase64) {
    var r1 = await fetch(BASE_URL + '/upload/public', {
      method: 'POST',
      headers: { 'Authorization': getApiKey(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ mime_type: 'image/png' })
    });
    if (!r1.ok) { throw new Error('署名URL取得 ' + r1.status + ': ' + (await r1.text())); }
    var info = await r1.json();
    var r2 = await fetch(info.url, {
      method: 'PUT',
      headers: { 'Content-Type': 'image/png' },
      body: b64ToBlob(pngBase64, 'image/png')
    });
    if (!r2.ok) { throw new Error('画像PUT ' + r2.status + ': ' + (await r2.text())); }
    return info.url.split('?')[0];
  }

  // ===== カタログ新規登録 (POST /products) =====
  async function registerCatalog(f, btn) {
    if (btn) btn.disabled = true; // 二重送信ガード
    showLoading('重複チェック中...');
    try {
      // 1) 重複ガード
      if (f.mpn) {
        var existing = await findByMpn(f.mpn);
        if (existing.length) {
          var e0 = existing[0];
          addToSelection(e0.id, e0.title || f.title, e0.code || '(既存)', null, null);
          showToast('既に存在したため選択に追加しました', 'success');
          resetResultView();
          return;
        }
      }
      // 2) 画像（任意）
      var imageUrls = [];
      if (f.usePhoto && lastShotBase64) {
        showLoading('背景除去中...');
        var png = await removeBg(lastShotBase64);
        showLoading('画像アップロード中...');
        imageUrls.push(await uploadImageToRecore(png));
      }
      // 3) 登録
      var attribute = {};
      if (f.mpn) attribute.mpn = f.mpn;
      if (f.rarity) attribute.custom_rarity = f.rarity;
      if (f.expansion) attribute.custom_expansion_name = f.expansion;
      var body = { title: f.title, attribute: attribute, category_id: f.categoryId };
      if (imageUrls.length) body.image_urls = imageUrls;

      showLoading('カタログ登録中...');
      var res = await fetch(BASE_URL + '/products', {
        method: 'POST',
        headers: { 'Authorization': getApiKey(), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) { throw new Error('登録 ' + res.status + ': ' + (await res.text())); }
      var created = await res.json();

      // 4) 登録後に再検索で確認
      var canonical = created, searchable = false;
      if (f.mpn) {
        showLoading('検索ヒット確認中...');
        var found = await findByMpn(f.mpn);
        var hit = found.filter(function(x) { return x.id === created.id; });
        if (hit.length) { canonical = hit[0]; searchable = true; }
      }
      addToSelection(canonical.id, canonical.title || f.title, canonical.code || '(新規)', null, null);
      resetResultView();
      if (f.mpn && !searchable) {
        showToast('登録OK。ただしpa_mpn検索に出ませんでした→カテゴリ属性設定を要確認', 'error');
      } else {
        showToast('マスタ登録＆リスト追加しました ✓', 'success');
      }
    } catch (e) {
      showToast('登録失敗: ' + e.message, 'error');
    } finally {
      if (btn) btn.disabled = false;
      hideLoading();
    }
  }

  // ===== 選択リスト =====
  function updateList() {
    var count = selectedProducts.length;
    el('selected-count').textContent = count;
    el('btn-finish').disabled = count === 0;
    el('selected-list').style.display = count > 0 ? 'block' : 'none';
    el('selected-items-container').innerHTML = selectedProducts.map(function(p, i) {
      var priceLabel = (p.buy != null) ? '買 ' + yen(p.buy) : '';
      return '<div class="selected-item">' +
        '<span class="check">✓</span>' +
        '<span class="name">' + (p.title || p.code).substring(0, 24) + '</span>' +
        (priceLabel ? '<span class="price">' + priceLabel + '</span>' : '') +
        '<button class="remove" data-idx="' + i + '">✕</button>' +
        '</div>';
    }).join('');
    var removes = el('selected-items-container').querySelectorAll('.remove');
    for (var i = 0; i < removes.length; i++) {
      (function(btn) {
        btn.onclick = function() {
          selectedProducts.splice(parseInt(btn.getAttribute('data-idx')), 1);
          updateList();
        };
      })(removes[i]);
    }
  }

  // ===== 完了ボタン =====
  function onFinish() {
    if (!selectedProducts.length) { showToast('リストが空です', 'error'); return; }
    if (mode === 'catalog') {
      showDone(selectedProducts.length + '件をマスタ登録しました', null);
    } else {
      showConfirm();
    }
  }

  // ===== 確認（買取/店間移動） =====
  function showConfirm() {
    el('scan-panel').style.display = 'none';
    el('confirm-panel').style.display = 'block';
    el('mode-badge').textContent = '確認';
    var isBig = (mode === 'big');
    el('confirm-title').textContent = (isBig ? '一般仕入れ' : '買取') + 'ケース作成確認';
    el('btn-submit').textContent = isBig ? '🚚 一般仕入れケースを作成する' : '🛒 買取ケースを作成する';
    el('confirm-list').innerHTML = selectedProducts.map(function(p, i) {
      var priceLabel = (p.buy != null) ? (isBig ? '仕入単価 ' : '買取推奨 ') + yen(p.buy) : '価格未設定';
      return '<div class="confirm-item">' +
        '<div class="confirm-num">' + (i + 1) + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:13px;font-weight:600">' + (p.title || '（不明）').substring(0, 35) + '</div>' +
          '<div style="font-size:11px;color:var(--text2);font-family:monospace">' + p.code + ' ・ ' + priceLabel + '</div>' +
        '</div></div>';
    }).join('');
  }

  // ===== ケース作成（買取=bas_cases / 店間移動=big_cases） =====
  function createCase() {
    el('btn-submit').disabled = true;
    var isBig = (mode === 'big');
    showLoading((isBig ? '一般仕入れ' : '買取') + 'ケース作成中...');
    var endpoint = isBig ? '/big_cases' : '/v2/bas_cases';
    var goods = selectedProducts.map(function(p) {
      if (isBig) {
        return { product_id: p.product_id, quantity: 1, unit_price: (p.buy != null ? p.buy : 0) };
      }
      return { product_id: p.product_id, quantity: 1 };
    });
    fetch(BASE_URL + endpoint, {
      method: 'POST',
      headers: {
        'Authorization': getApiKey(),
        'Content-Type': 'application/json',
        'X-Store-Id': String(storeId)
      },
      body: JSON.stringify({
        note: 'いーくらスキャン(' + (isBig ? '一般仕入れ' : '買取') + ') - ' + new Date().toLocaleString('ja-JP'),
        goods: goods
      })
    }).then(function(res) {
      if (!res.ok) { return res.text().then(function(t) { throw new Error('status ' + res.status + ': ' + t); }); }
      return res.json();
    }).then(function(result) {
      hideLoading();
      showDone(selectedProducts.length + '件の商品が登録されました', result.code || '作成済み');
    }).catch(function(e) {
      hideLoading();
      el('btn-submit').disabled = false;
      showToast('ケース作成に失敗しました: ' + e.message, 'error');
    });
  }

  // ===== 完了画面 =====
  function showDone(detail, code) {
    el('scan-panel').style.display = 'none';
    el('confirm-panel').style.display = 'none';
    el('done-panel').style.display = 'block';
    el('mode-badge').textContent = '完了';
    el('done-title').textContent = (mode === 'catalog') ? 'マスタ登録完了' : modeLabel(mode) + 'ケース作成完了';
    el('done-sub').textContent = (mode === 'catalog') ? 'RECOREの商品マスタに登録しました' : 'RECOREに以下のケースが作成されました';
    if (code) { el('done-code').style.display = 'block'; el('done-code').textContent = code; }
    else { el('done-code').style.display = 'none'; }
    el('done-detail').textContent = detail;
  }

  function restart() {
    resetSession();
    el('done-panel').style.display = 'none';
    el('confirm-panel').style.display = 'none';
    el('scan-panel').style.display = 'block';
    el('mode-badge').textContent = modeLabel(mode);
  }

  // ===== イベント =====
  el('btn-start').addEventListener('click', goModeSelect);
  el('btn-modeback').addEventListener('click', backToMode);
  el('cat-verify').addEventListener('click', verifyCategory);
  el('cat-id-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') verifyCategory(); });
  el('cat-start').addEventListener('click', startCatalog);
  el('cat-cancel').addEventListener('click', function() { closeCatModal(); el('mode-panel').style.display = 'block'; });
  var modeCards = document.querySelectorAll('.mode-card');
  for (var i = 0; i < modeCards.length; i++) {
    (function(card) {
      card.addEventListener('click', function() { selectMode(card.getAttribute('data-mode')); });
    })(modeCards[i]);
  }
  el('btn-shoot').addEventListener('click', shoot);
  el('btn-manual').addEventListener('click', manualSearch);
  el('manual-mpn').addEventListener('keydown', function(e) { if (e.key === 'Enter') manualSearch(); });
  el('btn-finish').addEventListener('click', onFinish);
  el('btn-submit').addEventListener('click', createCase);
  el('btn-back').addEventListener('click', function() {
    el('confirm-panel').style.display = 'none';
    el('scan-panel').style.display = 'block';
    el('mode-badge').textContent = modeLabel(mode);
  });
  el('btn-restart').addEventListener('click', restart);
})();
</script>
</body>
</html>
